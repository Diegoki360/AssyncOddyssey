<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zelda Armory</title>
</head>
<body>

    <h1>Zelda Armory</h1>
    <p>Explora el equipamiento de The Legend of Zelda</p>
    
    <label>Zona de Hyrule:</label>

    <select id="zona">
        <option value="">Todas las zonas</option>
    </select>

    <label for="tipo">Tipo de equipamiento:</label>

    <select id="tipo">
        <option value="">Todos los tipos</option>
    </select>

    <p id="resumenTipos"></p>
    <label>Buscar equipamiento:</label>
    <input type="text" id="busqueda" placeholder="Ej: Master Sword">

    <button id="filtrar">Filtrar</button>

    <div id="contenedor"></div>

    <script type="module" src="/src/main.js"></script>

</body>
</html>
